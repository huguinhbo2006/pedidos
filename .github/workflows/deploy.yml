name: Deploy Pedidos (Angular) to Hostinger

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build-and-deploy:
    name: Build & Deploy Angular Pedidos
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Validate SSH Secret
        run: |
          if [ -z "${{ secrets.HOSTINGER_SSH_PASSWORD }}" ] && [ -z "${{ secrets.HOSTINGER_SSH_KEY }}" ]; then
            echo "❌ Falta configurar el secreto HOSTINGER_SSH_PASSWORD o HOSTINGER_SSH_KEY en GitHub -> Settings -> Secrets and variables -> Actions."
            exit 1
          fi

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install Dependencies
        run: npm ci

      - name: Build Production Bundle
        run: npm run build

      - name: Package Browser Build Contents
        run: |
          cd dist/tacos-dorados-web/browser
          tar -czf ../../../pedidos-dist.tar.gz .

      - name: Ensure Target Directory Exists on Hostinger
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.HOSTINGER_SSH_HOST || '195.35.39.62' }}
          port: ${{ secrets.HOSTINGER_SSH_PORT || '65002' }}
          username: ${{ secrets.HOSTINGER_SSH_USER || 'u111559603' }}
          key: ${{ secrets.HOSTINGER_SSH_KEY }}
          password: ${{ secrets.HOSTINGER_SSH_PASSWORD }}
          script: |
            TARGET="${{ secrets.PEDIDOS_TARGET_DIR || '/home/u111559603/domains/taqueriamary.com/public_html/pedidos' }}"
            mkdir -p "$TARGET"

      - name: Upload Package Archive via SCP
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.HOSTINGER_SSH_HOST || '195.35.39.62' }}
          port: ${{ secrets.HOSTINGER_SSH_PORT || '65002' }}
          username: ${{ secrets.HOSTINGER_SSH_USER || 'u111559603' }}
          key: ${{ secrets.HOSTINGER_SSH_KEY }}
          password: ${{ secrets.HOSTINGER_SSH_PASSWORD }}
          source: "pedidos-dist.tar.gz"
          target: "${{ secrets.PEDIDOS_TARGET_DIR || '/home/u111559603/domains/taqueriamary.com/public_html/pedidos' }}"
          timeout: 120s

      - name: Extract Build Package into Hostinger
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.HOSTINGER_SSH_HOST || '195.35.39.62' }}
          port: ${{ secrets.HOSTINGER_SSH_PORT || '65002' }}
          username: ${{ secrets.HOSTINGER_SSH_USER || 'u111559603' }}
          key: ${{ secrets.HOSTINGER_SSH_KEY }}
          password: ${{ secrets.HOSTINGER_SSH_PASSWORD }}
          script: |
            TARGET="${{ secrets.PEDIDOS_TARGET_DIR || '/home/u111559603/domains/taqueriamary.com/public_html/pedidos' }}"
            cd "$TARGET"
            find . -maxdepth 1 ! -name '.' ! -name 'pedidos-dist.tar.gz' -exec rm -rf {} +
            tar -xzf pedidos-dist.tar.gz
            rm -f pedidos-dist.tar.gz
            echo "✅ Frontend desplegado correctamente en $TARGET"
